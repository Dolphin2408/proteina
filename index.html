<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra chứng từ nhập khẩu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F3D4C; --ink-2:#2B5563; --paper:#F6F8F7; --card:#FFFFFF; --line:#D5DEDD; --muted:#5B6B73;
  --ok:#2F7D5B; --ok-bg:#E3F1EA; --warn:#B88400; --warn-bg:#FBF1D6; --bad:#B23A2E; --bad-bg:#F8E1DE;
  --info:#24607A; --info-bg:#E2EEF3; --text:#16252B; --accent:#E8B12A;
  --r:6px; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --stencil:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#9CC9D6;--ink-2:#C3DDE4;--paper:#0E1A1F;--card:#15252C;--line:#2C4048;--muted:#94A8AF;
  --ok:#6FC59A;--ok-bg:#183A2B;--warn:#E8B12A;--warn-bg:#3A3016;--bad:#F08A7D;--bad-bg:#43211D;
  --info:#8CC2D8;--info-bg:#18323D;--text:#E4EDEF;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.55 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0}
@media (prefers-color-scheme:dark){header.top{background:#0A2A35}}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand b{font:700 22px/1 var(--stencil);letter-spacing:.02em}
.who{font-size:13px;opacity:.85}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
nav.tabs a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:var(--r) var(--r) 0 0;white-space:nowrap;opacity:.8}
nav.tabs a.on{background:var(--paper);color:var(--ink);opacity:1;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
h1,h2,h3{font-family:var(--stencil);letter-spacing:.01em;line-height:1.15;margin:0 0 8px}
h1{font-size:28px}h2{font-size:22px;margin-top:18px}h3{font-size:18px}
.muted{color:var(--muted)}.small{font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
label.f>span{color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:120px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ok)}
input:disabled,select:disabled,textarea:disabled{opacity:.65}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme:dark){.btn{color:#0E1A1F}.btn.ghost{color:var(--ink)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0E1A1F}}
/* thẻ trạng thái: hình thẻ niêm phong container */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px 2px 10px;border-radius:2px 10px 10px 2px;border-left:4px solid currentColor;white-space:nowrap}
.t-ok{color:var(--ok);background:var(--ok-bg)}.t-warn{color:var(--warn);background:var(--warn-bg)}
.t-bad{color:var(--bad);background:var(--bad-bg)}.t-info{color:var(--info);background:var(--info-bg)}
.t-mute{color:var(--muted);background:transparent;border-left-color:var(--line)}
.co{font:700 13px/1 var(--stencil);letter-spacing:.06em;padding:4px 7px;border:2px solid currentColor;border-radius:3px}
.co-PRT{color:#24607A}.co-GK{color:#2F7D5B}.co-CALI{color:#9A5B1E}
@media (prefers-color-scheme:dark){.co-PRT{color:#8CC2D8}.co-GK{color:#6FC59A}.co-CALI{color:#E2A867}}
/* số B/L in như chữ kẻ trên vỏ container */
.bl{font:700 22px/1.05 var(--stencil);letter-spacing:.05em;word-break:break-all}
.bl.big{font-size:clamp(30px,8vw,46px);color:var(--ink)}
.lot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;background:var(--card)}
.lot:hover{background:var(--info-bg)}
.lot .meta{font-size:13px;color:var(--muted)}
.lot.hot{box-shadow:inset 4px 0 0 var(--bad)}.lot.warm{box-shadow:inset 4px 0 0 var(--warn)}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--paper);position:sticky;top:0}
td.v{white-space:pre-wrap;word-break:break-word;min-width:140px}
mark{background:var(--bad-bg);color:var(--bad);border-bottom:2px solid var(--bad);padding:0 1px}
.miss{color:var(--bad);font-weight:700}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0}
details.sec>summary{cursor:pointer;padding:12px 14px;font:600 19px/1.2 var(--stencil);list-style:none;display:flex;justify-content:space-between;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:22px;color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
details.sec>.in{padding:0 14px 14px}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));margin:0 -14px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.verdict{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--paper);padding:10px 16px;border-radius:var(--r);max-width:92vw;z-index:99;display:none;font-size:14px}
#toast.bad{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,25,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>.box{background:var(--card);width:min(980px,100%);max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.modal{align-items:center}.modal>.box{border-radius:12px}}
.canvas-wrap{overflow:auto;max-height:58vh;border:1px solid var(--line);position:relative;touch-action:none;background:#888}
.canvas-wrap canvas{display:block}
.selbox{position:absolute;border:2px solid var(--accent);background:rgba(232,177,42,.18);pointer-events:none}
.login{max-width:380px;margin:9vh auto;padding:0 14px}
.login h1{font-size:40px;color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.legend{font-size:13px;color:var(--muted);margin-top:6px}
@media print{header.top,.bar,.noprint,button,#toast{display:none!important}details.sec{border:0}details.sec>.in{display:block!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"><div class="empty">Đang tải…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ====== Kết nối: chỉ dùng địa chỉ dự án và khóa công khai (publishable) ====== */
const SUPA_URL = "https://dkmzmlibhdeoivuvejmj.supabase.co";
const SUPA_KEY = "sb_publishable_qUFOWX7fYKtaZzLyE1qSJA_dOhCDE4H";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

/* ====== Tiện ích ====== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD = d => d ? d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4) : "";
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = (d,n) => { const x = new Date(d+"T00:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const daysTo = d => d ? Math.round((new Date(d+"T00:00:00Z") - new Date(today()+"T00:00:00Z"))/864e5) : null;
const num = v => v == null ? "" : Number(v).toLocaleString("vi-VN", {maximumFractionDigits:3});
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className=bad?"bad":""; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", bad?6000:3000); }
function fail(e){ console.error(e); toast(viErr(e?.message || String(e)), true); }
function viErr(m){
  if(/row-level security/i.test(m)) return "Bạn không có quyền thực hiện thao tác này.";
  if(/duplicate key/i.test(m)) return "Dữ liệu này đã tồn tại (bị trùng).";
  if(/Invalid login/i.test(m)) return "Sai email hoặc mật khẩu.";
  if(/permission denied/i.test(m)) return "Bạn không có quyền với dữ liệu này.";
  return m;
}
async function q(p){ const {data,error} = await p; if(error) throw error; return data; }
async function all(mk){ let out=[], from=0; for(;;){ const d = await q(mk().range(from, from+999)); out = out.concat(d); if(d.length < 1000) break; from += 1000; } return out; }
const scripts = {};
function loadScript(src){ return scripts[src] ||= new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("Không tải được thư viện: "+src)); document.head.appendChild(s); }); }
const LIB = {
  pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfw:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  mammoth:"https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js",
  xlsx:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  ocr:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js",
  exceljs:"https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"
};

/* ====== Trạng thái chung ====== */
const S = { me:null, users:[], lots:[], cat:{}, filter:{cty:"", hs:"", ma:"", sp:"", nv:"", tt:"", tuan:"", q:"", n:60}, repCty:"", sel:new Set(), selMode:false };
const canDelete = () => isQL() || isQT();
const ROLE = {quan_tri:"Quản trị viên", quan_ly:"Trưởng phòng", nhan_vien:"Nhân viên chứng từ"};
const userName = id => S.users.find(u=>u.id===id)?.ho_ten || "—";
const isQL = () => S.me?.vai_tro === "quan_ly";
const isQT = () => S.me?.vai_tro === "quan_tri";
const canEditLot = l => isQL() || (S.me?.vai_tro==="nhan_vien" && l.nhan_vien_phu_trach===S.me.id);
const cfg = (k,d) => Number(S.cat.cau_hinh?.find(c=>c.ten_muc===k)?.gia_tri ?? d);
const hsName = id => S.cat.ho_so_nuoc?.find(h=>h.id===id)?.ten_ho_so || "—";
const loaiName = id => S.cat.loai_chung_tu?.find(l=>l.id===id)?.ten_loai || "—";
const truongName = m => S.cat.truong_thong_tin?.find(t=>t.ma_truong===m)?.ten_truong || m;

function tagKiem(t){ return `<span class="tag ${t==="Đạt"?"t-ok":t==="Thiếu/sai cần bổ sung"?"t-bad":t==="Đang kiểm"?"t-info":"t-mute"}">${esc(t)}</span>`; }
function tagCT(t){ return `<span class="tag ${t==="Đạt"?"t-ok":t==="Nháp"?"t-mute":t==="Chờ xác nhận"?"t-info":"t-bad"}">${esc(t)}</span>`; }
function tagKQ(k){ const c={"Gốc":"t-info","Khớp":"t-ok","Khớp (tick tay)":"t-ok","Lệch":"t-bad","Chờ tick":"t-warn","Không có thông tin":"t-bad","Chưa nhập":"t-mute"}[k]||"t-mute"; return `<span class="tag ${c}">${esc(k||"Chưa nhập")}</span>`; }

/* Cảnh báo hạn của lô: trả về [mức, lời nhắc] */
function lotAlert(l){
  const out=[]; const nDD=cfg("so_ngay_nhac_dem_det",3);
  if(!l.ngay_thong_quan){
    for(const [k,lbl] of [["han_dem","DEM"],["han_det","DET"]]){ const d=daysTo(l[k]); if(d!=null && d<=nDD && d>=-30) out.push([d<0?"hot":"hot", d<0?`Quá hạn ${lbl} ${-d} ngày`:`Còn ${d} ngày hết ${lbl}`]); }
  }
  const e=daysTo(l.eta);
  if(!l.ngay_thanh_toan && e!=null && e>=0 && e<=cfg("so_ngay_nhac_thanh_toan",14)) out.push(["warm",`Cần thanh toán, ETA còn ${e} ngày`]);
  else if(e!=null && e>=0 && e<=3 && !l.ngay_cap_thuc_te) out.push(["warm",`Sắp cập cảng (${e} ngày)`]);
  return out;
}

/* ====== Khởi động & đăng nhập ====== */
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ S.me=null; route(); } });
(async function boot(){
  window.addEventListener("hashchange", route);
  const {data:{session}} = await sb.auth.getSession();
  if(session) await afterLogin(session.user); else viewLogin();
})();

function viewLogin(msg){
  $("#app").innerHTML = `<div class="login">
    <h1>Kiểm tra chứng từ nhập khẩu</h1>
    <p class="muted">Proteina · GK · Cali. Đăng nhập bằng tài khoản được cấp.</p>
    <form id="lf" class="panel" autocomplete="on">
      <label class="f"><span>Email</span><input id="le" type="email" required autocomplete="username" inputmode="email"></label>
      <label class="f" style="margin-top:10px"><span>Mật khẩu</span><input id="lp" type="password" required autocomplete="current-password"></label>
      <p id="lm" class="small" style="color:var(--bad)">${esc(msg||"")}</p>
      <button class="btn" style="width:100%">Đăng nhập</button>
    </form></div>`;
  $("#lf").onsubmit = async e=>{
    e.preventDefault(); $("#lm").textContent="Đang đăng nhập…";
    const {data,error} = await sb.auth.signInWithPassword({email:$("#le").value.trim(), password:$("#lp").value});
    if(error) return $("#lm").textContent = viErr(error.message);
    await afterLogin(data.user);
  };
}

async function afterLogin(user){
  try{
    const me = await q(sb.from("nguoi_dung").select("*").eq("id",user.id).maybeSingle());
    if(!me || !me.dang_hoat_dong){ await sb.auth.signOut(); return viewLogin("Tài khoản chưa được kích hoạt. Liên hệ quản trị viên."); }
    S.me = me;
    $("#app").innerHTML = `<div class="empty">Đang tải dữ liệu…</div>`;
    await loadCatalogs(); await loadLots();
    if(!location.hash) location.hash = isQL() ? "#bao-cao" : "#lo-hang"; else route();
  }catch(e){ fail(e); viewLogin(e.message); }
}

async function loadCatalogs(){
  const t = ["cong_ty","ho_so_nuoc","loai_chung_tu","chung_tu_theo_ho_so","truong_thong_tin","ten_goi","truong_theo_chung_tu","cau_hinh"];
  const res = await Promise.all(t.map(x=>all(()=>sb.from(x).select("*"))));
  t.forEach((x,i)=>S.cat[x]=res[i]);
  S.cat.ho_so_nuoc.sort((a,b)=>a.ten_ho_so.localeCompare(b.ten_ho_so,"vi"));
  S.users = await q(sb.rpc("ds_nhan_vien"));
}
async function loadLots(){ S.lots = await all(()=>sb.from("lo_hang_xem").select("*").order("eta",{ascending:false}).order("so_bl")); }

/* ====== Khung trang & điều hướng ====== */
function shell(active, html){
  const tabs = [];
  if(isQL()) tabs.push(["#bao-cao","Báo cáo"]);
  tabs.push(["#lo-hang","Lô hàng"]);
  if(isQT()) tabs.push(["#quan-tri","Quản trị"]);
  $("#app").innerHTML = `<header class="top"><div class="brand"><b>Kiểm tra chứng từ NK</b>
    <span class="who">${esc(S.me.ho_ten||S.me.email)} · ${ROLE[S.me.vai_tro]} <button id="pw" class="btn sm ghost" style="color:#fff;border-color:#fff8;margin-left:6px">Đổi mật khẩu</button><button id="out" class="btn sm ghost" style="color:#fff;border-color:#fff8;margin-left:6px">Đăng xuất</button></span></div>
    <nav class="tabs">${tabs.map(([h,t])=>`<a href="${h}" class="${active===h?"on":""}">${t}</a>`).join("")}</nav></header>
    <main id="main">${html}</main>`;
  $("#out").onclick = ()=>sb.auth.signOut();
  $("#pw").onclick = changeMyPassword;
}
function route(){
  if(!S.me) return viewLogin();
  const h = decodeURIComponent(location.hash||"");
  if(h.startsWith("#lo/")) return viewLot(h.slice(4));
  if(h.startsWith("#ct/")) return viewDoc(+h.slice(4));
  if(h==="#bao-cao" && isQL()) return viewReport();
  if(h==="#quan-tri" && isQT()) return viewAdmin();
  if(h==="#tao-lo") return viewNewLot();
  return viewList();
}

/* ====== Báo cáo Trưởng phòng (mục 7) ====== */
async function viewReport(){
  shell("#bao-cao", `<div class="empty">Đang lập báo cáo…</div>`);
  const t=today(), cty=S.repCty;
  const L = S.lots.filter(l=>!cty || l.cong_ty===cty);
  const nCap=cfg("so_ngay_nhac_cap_cang",14), nTT=cfg("so_ngay_nhac_thanh_toan",14), nDD=cfg("so_ngay_nhac_dem_det",3);
  const dangKiem = L.filter(l=>l.trang_thai_kiem==="Đang kiểm"||l.trang_thai_kiem==="Thiếu/sai cần bổ sung");
  // Đếm chứng từ sai / thiếu bắt buộc cho các lô đang kiểm
  const cnt = {};
  for(let i=0;i<dangKiem.length;i+=200){
    const bls = dangKiem.slice(i,i+200).map(l=>l.so_bl);
    const cts = await q(sb.from("chung_tu").select("so_bl,loai_chung_tu_id,trang_thai").in("so_bl",bls));
    for(const l of dangKiem.slice(i,i+200)){
      const mine = cts.filter(c=>c.so_bl===l.so_bl);
      const req = S.cat.chung_tu_theo_ho_so.filter(r=>r.ho_so_nuoc_id===l.ho_so_nuoc_id && r.bat_buoc);
      const thieu = req.filter(r=>!mine.some(c=>c.loai_chung_tu_id===r.loai_chung_tu_id)).length;
      const sai = mine.filter(c=>c.trang_thai==="Sai – chờ nhà cung cấp sửa").length;
      cnt[l.so_bl] = {sai, thieu};
    }
  }
  const sapCap = L.filter(l=>!l.ngay_cap_thuc_te && l.eta>=t && l.eta<=addDays(t,nCap)).sort((a,b)=>a.eta.localeCompare(b.eta));
  const canTT = L.filter(l=>!l.ngay_thanh_toan && l.eta>=t && l.eta<=addDays(t,nTT)).sort((a,b)=>a.eta.localeCompare(b.eta));
  const hetDem = L.filter(l=>!l.ngay_thong_quan && l.han_dem && l.han_dem<=addDays(t,nDD) && l.han_dem>=addDays(t,-30)).sort((a,b)=>a.han_dem.localeCompare(b.han_dem));
  const hetDet = L.filter(l=>!l.ngay_thong_quan && l.han_det && l.han_det<=addDays(t,nDD) && l.han_det>=addDays(t,-30)).sort((a,b)=>a.han_det.localeCompare(b.han_det));

    ${sec("Lô đang kiểm", dangKiem, l=>row(l, `${tagKiem(l.trang_thai_kiem)}<div class="small muted">${cnt[l.so_bl]?.sai||0} sai · ${cnt[l.so_bl]?.thieu||0} thiếu</div>`), "Không có lô nào đang kiểm.")}

    ${sec("Cần thanh toán", canTT, l=>row(l, `<span class="tag t-warn">ETA còn ${daysTo(l.eta)} ngày</span><div class="small muted">${l.so_invoice?esc(l.so_invoice):"Chưa có invoice"}</div>`), "Không có lô cần thanh toán.")}

    ${sec("Sắp hết hạn DET", hetDet, l=>row(l, han(l.han_det,"Hạn DET")), "Không có lô sắp hết DET.")}`;

function describeFilter(){
  const F=S.filter, p=[];
  if(F.cty) p.push("Công ty "+F.cty); if(F.hs) p.push("Nước "+hsName(+F.hs)); if(F.ma) p.push("Mã SP "+F.ma); if(F.sp) p.push("Sản phẩm "+F.sp);

}

function xlToISO(v){
  if(v==null||v==="") return null;
  if(typeof v==="number"){ const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5); return d.toISOString().slice(0,10); }
  const t=String(v).trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return "BAD";
}
function validISO(d){ if(!d||d==="BAD") return false; const x=new Date(d+"T00:00:00Z"); return !isNaN(x) && x.toISOString().slice(0,10)===d; }

async function parseImport(file, m){
  const box=m.querySelector("#impRes"); box.innerHTML=`<p class="muted">Đang đọc ${esc(file.name)}…</p>`;
  await loadScript(LIB.xlsx);
  const wb=XLSX.read(await file.arrayBuffer());
  const rows=[], errs=[], warns=[], keys=new Set(IMP.map(x=>x[0]));
  const lotSheets=wb.SheetNames.filter(n=>/^lo_(prt|gk|cali)$/i.test(n) || /^lo_hang$/i.test(n));
  if(!lotSheets.length) throw new Error("Không thấy sheet Lo_PRT, Lo_GK hoặc Lo_CALI trong file. Tải file mẫu để xem đúng định dạng.");
  for(const sn of lotSheets){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1, raw:true, defval:null, blankrows:false});
    if(!aoa.length) continue;
    const head=aoa[0].map(h=>String(h??"").trim().toLowerCase());
    if(!head.includes("so_bl")){ errs.push([sn,1,"Dòng 1 không có cột so_bl. Giữ nguyên dòng tên cột của file mẫu."]); continue; }
    const iBL=head.indexOf("so_bl");
    let start=1; if(aoa[1] && /b\/l|mã lô|ma lo/i.test(String(aoa[1][iBL]??""))) start=2;
    const coFromSheet=(sn.match(/^lo_(prt|gk|cali)$/i)||[])[1]?.toUpperCase();
    for(let r=start;r<aoa.length;r++){
      const a=aoa[r]; const raw={}; head.forEach((h,i)=>{ if(keys.has(h)||h==="cong_ty") raw[h]=a[i]; });
      if(raw.so_bl==null||String(raw.so_bl).trim()==="") continue;
      if(/^VD-/i.test(String(raw.so_bl).trim())) continue; // dòng ví dụ của file mẫu
      rows.push({sheet:sn, line:r+1, raw, cong_ty:coFromSheet||String(raw.cong_ty||"").trim().toUpperCase()});
    }
  }
  // Tra email -> tài khoản
  const emails=[...new Set(rows.map(x=>String(x.raw.nhan_vien_phu_trach||"").trim()).filter(v=>v.includes("@")))];
  const isNV = S.me.vai_tro==="nhan_vien";
  const emap={}; if(emails.length && !isNV){ const d=await q(sb.rpc("nhan_vien_theo_email",{p_emails:emails})); d.forEach(x=>emap[x.email.toLowerCase()]=x.id); }
  const hsMap={}; S.cat.ho_so_nuoc.forEach(h=>hsMap[normKey(h.ten_ho_so)]=h.id);
  const lMap={}; S.cat.loai_chung_tu.forEach(l=>lMap[normKey(l.ten_loai)]=l.id);
  const invId=S.cat.loai_chung_tu.find(l=>/invoice/i.test(l.ten_loai))?.id;
  const existing=new Set(S.lots.map(l=>l.so_bl)); const seen=new Set(); const good=[]; const atOf={};
  const owner={}; S.lots.forEach(l=>owner[l.so_bl]=l.nhan_vien_phu_trach);
  for(const x of rows){
    const o={}, e=[], R=x.raw, at=`${x.sheet} dòng ${x.line}`;
    o.so_bl=String(R.so_bl).trim().toUpperCase();
    if(/\s/.test(o.so_bl)) e.push("Số B/L có khoảng trắng");
    if(seen.has(o.so_bl)) e.push("Số B/L bị trùng trong file"); seen.add(o.so_bl);
    if(!["PRT","GK","CALI"].includes(x.cong_ty)) e.push("Không xác định được công ty (tên sheet phải là Lo_PRT, Lo_GK hoặc Lo_CALI)"); o.cong_ty=x.cong_ty;
    const nv=String(R.nhan_vien_phu_trach??"").trim();
    if(isNV){
      const mine = !nv || nv.toLowerCase()===String(S.me.email).toLowerCase() || (S.me.ho_ten && normKey(nv)===normKey(S.me.ho_ten));
      if(mine) o.nhan_vien_phu_trach=S.me.id; else e.push(`Lô của người khác (“${nv}”): bạn chỉ nhập được lô của chính mình`);
    } else {
      o.nhan_vien_phu_trach = emap[nv.toLowerCase()] || S.users.find(u=>normKey(u.ho_ten)===normKey(nv))?.id;
      if(!o.nhan_vien_phu_trach) e.push(nv?`Không tìm thấy nhân viên “${nv}”`:"Thiếu nhân viên phụ trách");
    }
    atOf[o.so_bl]=[x.sheet,x.line];
    const hs=String(R.ho_so_nuoc??"").trim(); o.ho_so_nuoc_id=hsMap[normKey(hs)];
    if(!o.ho_so_nuoc_id){ o.ho_so_nuoc_id=hsMap[normKey("Mẫu chung")]; warns.push([at, hs?`Hồ sơ nước “${hs}” chưa có, gán “Mẫu chung”`:"Thiếu hồ sơ nước, gán “Mẫu chung”"]); }
    const g=String(R.chung_tu_goc??"").trim(); o.chung_tu_goc_id = g ? lMap[normKey(g)] : invId;
    if(!o.chung_tu_goc_id){ o.chung_tu_goc_id=invId; warns.push([at,`Chứng từ gốc “${g}” không có trong danh mục, dùng Invoice`]); }
    for(const [k,,t] of IMP){
      if(["so_bl","nhan_vien_phu_trach","ho_so_nuoc","chung_tu_goc"].includes(k)) continue;
      const v=R[k]; if(v==null||String(v).trim()===""){ if(t!=="b") o[k]=null; else o[k]=false; continue; }
      if(t==="s") o[k]=String(v).trim();
      else if(t==="n"){ const n=typeof v==="number"?v:Number(String(v).replace(/,/g,"")); if(isNaN(n)||n<0) e.push(`${k}: “${v}” không phải số hợp lệ`); else o[k]=k==="so_cont"||k.startsWith("mien_")?Math.round(n):n; }
      else if(t==="d"){ const d=xlToISO(v); if(!validISO(d)) e.push(`${k}: “${v}” không phải ngày hợp lệ`); else o[k]=d; }
      else if(t==="b") o[k]=/^(có|co|x|1|true|yes|combined)$/i.test(String(v).trim());
      else if(t==="e"){
        let val=String(v).trim();
        if(k==="loai_cont"){ val=/40/.test(val)?"40 feet":/20/.test(val)?"20 feet":null; if(!val) e.push(`loai_cont: “${v}” phải là 20' hoặc 40'`); o[k]=val; continue; }
        const hit=ENUM[k].find(x=>normKey(x)===normKey(val)); if(!hit) e.push(`${k}: “${v}” ngoài danh mục (${ENUM[k].join(", ")})`); else o[k]=hit;
      }
    }
    if(!o.san_pham) e.push("Thiếu sản phẩm"); if(!o.eta) e.push("Thiếu ETA");
    if(o.trang_thai_kiem==="Đạt"){ o.trang_thai_kiem="Chờ chứng từ"; warns.push([at,"Trạng thái “Đạt” không nhập được; lô vào ở “Chờ chứng từ”"]); }
    if(!o.trang_thai_kiem) delete o.trang_thai_kiem;
    if(e.length) errs.push([x.sheet,x.line,o.so_bl+": "+e.join("; ")]); else good.push(o);
  }
  // Nhật ký
  const nkRows=[]; const nkSheet=wb.SheetNames.find(n=>/^nhat_ky_lo$/i.test(n));
  if(nkSheet){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nkSheet],{header:1,raw:true,defval:null,blankrows:false});
    const head=(aoa[0]||[]).map(h=>String(h??"").trim().toLowerCase()); const ib=head.indexOf("so_bl"), id=head.indexOf("ngay"), it=head.indexOf("noi_dung");
    let start=1; if(aoa[1] && /b\/l/i.test(String(aoa[1][ib]??""))) start=2;
    if(ib>=0&&id>=0&&it>=0) for(let r=start;r<aoa.length;r++){ const a=aoa[r]; if(!a[ib] || /^VD-/i.test(String(a[ib]).trim())) continue;
      const d=xlToISO(a[id]); const bl=String(a[ib]).trim().toUpperCase(); const t=String(a[it]??"").trim();
      if(!validISO(d)||!t){ errs.push([nkSheet,r+1,`${bl}: thiếu hoặc sai ngày / nội dung nhật ký`]); continue; }
      nkRows.push({so_bl:bl, ngay:d, noi_dung:t}); }
  }
  const neu=good.filter(o=>!existing.has(o.so_bl)); let cu=good.filter(o=>existing.has(o.so_bl));
  if(isNV){
    cu.filter(o=>owner[o.so_bl]!==S.me.id).forEach(o=>errs.push([...(atOf[o.so_bl]||["",""]), `${o.so_bl}: lô đã có và do người khác phụ trách, bạn không nhập hay sửa được`]));
    cu=cu.filter(o=>owner[o.so_bl]===S.me.id);
  }
  const canUpd = cu.length && (isQL() || isNV);
  box.innerHTML=`<div class="panel">
    <p><b>${rows.length}</b> dòng lô trong file: <b>${neu.length}</b> lô mới hợp lệ, <b>${cu.length}</b> lô đã có trong hệ thống, <b style="color:var(--bad)">${errs.length}</b> dòng lỗi.${nkRows.length?` Nhật ký: ${nkRows.length} dòng.`:""}</p>
    ${canUpd?`<label class="row small"><input type="checkbox" id="upd"> Cập nhật ${cu.length} lô đã có${isNV?" của bạn":""} bằng dữ liệu trong file</label>`:cu.length?`<p class="small muted">${cu.length} lô đã có sẽ được bỏ qua.</p>`:""}
    ${errs.length?`<details open><summary class="small"><b>Dòng lỗi (không nhập)</b></summary><div class="scroll"><table>${errs.slice(0,200).map(e=>`<tr><td class="small">${esc(e[0])} dòng ${e[1]}</td><td class="small">${esc(e[2])}</td></tr>`).join("")}</table></div></details>`:""}
    ${warns.length?`<details><summary class="small">Lưu ý (${warns.length})</summary><table>${warns.slice(0,200).map(w=>`<tr><td class="small">${esc(w[0])}</td><td class="small">${esc(w[1])}</td></tr>`).join("")}</table></details>`:""}
    <div class="row" style="margin-top:10px"><button id="go" class="btn" ${neu.length||canUpd||nkRows.length?"":"disabled"}>Nhập vào hệ thống</button><button class="btn ghost" data-close>Hủy</button></div></div>`;
  box.querySelector("#go").onclick=async ev=>{
    const btn=ev.target; btn.disabled=true; let ok=0, up=0; const fails=[];
    try{
      for(let i=0;i<neu.length;i+=100){ btn.textContent=`Đang nhập ${Math.min(i+100,neu.length)}/${neu.length}…`;
        const part=neu.slice(i,i+100);
        const {error}=await sb.from("lo_hang").insert(part);
        if(!error){ ok+=part.length; continue; }
        for(const o of part){ const {error:e2}=await sb.from("lo_hang").insert(o); if(e2) fails.push(`${o.so_bl}: ${viErr(e2.message)}`); else ok++; }
      }
      if(box.querySelector("#upd")?.checked){
        for(const o of cu){ const {so_bl,cong_ty,nhan_vien_phu_trach,...rest}=o; btn.textContent=`Đang cập nhật ${so_bl}…`;
          if(S.lots.find(l=>l.so_bl===so_bl)?.trang_thai_kiem==="Đạt") delete rest.trang_thai_kiem; // không hạ trạng thái lô đã Đạt
          const {data,error}=await sb.from("lo_hang").update(rest).eq("so_bl",so_bl).select("so_bl");
          if(error||!data?.length) fails.push(`${so_bl}: ${error?viErr(error.message):"không cập nhật được"}`); else up++; }
      }
      await loadLots(); const have=new Set(S.lots.filter(l=>!isNV||l.nhan_vien_phu_trach===S.me.id).map(l=>l.so_bl)); let nk=0;
      const nkOk=nkRows.filter(r=>have.has(r.so_bl)); nkRows.filter(r=>!have.has(r.so_bl)).forEach(r=>fails.push(`Nhật ký ${r.so_bl}: ${isNV?"lô không có hoặc không do bạn phụ trách":"lô không có trong hệ thống"}`));
      for(let i=0;i<nkOk.length;i+=200){ const {error}=await sb.from("nhat_ky_lo").insert(nkOk.slice(i,i+200)); if(error) fails.push("Nhật ký: "+viErr(error.message)); else nk+=Math.min(200,nkOk.length-i); }
      box.innerHTML=`<div class="panel"><p><b>Đã nhập ${ok} lô mới</b>${up?`, cập nhật ${up} lô`:""}${nk?`, ${nk} dòng nhật ký`:""}.</p>
        ${fails.length?`<p style="color:var(--bad)">${fails.length} mục không nhập được:</p><div class="scroll"><table>${fails.map(f=>`<tr><td class="small">${esc(f)}</td></tr>`).join("")}</table></div>`:""}
        <button class="btn" data-close>Xong</button></div>`;
      toast(`Đã nhập ${ok} lô`); viewList();
    }catch(e){ btn.disabled=false; btn.textContent="Nhập vào hệ thống"; fail(e); }
  };
}

function fieldInput(k,lbl,type,opts,val,dis){
  const d=dis?"disabled":"";
  if(type==="sel") return `<label class="f"><span>${lbl}</span><select data-k="${k}" ${d}>${opts.map(o=>`<option ${(val??"")===o?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  if(type==="bool") return `<label class="f"><span>${lbl}</span><select data-k="${k}" data-bool="1" ${d}><option value="false" ${!val?"selected":""}>Không</option><option value="true" ${val?"selected":""}>Có</option></select></label>`;
  return `<label class="f"><span>${lbl}</span><input data-k="${k}" type="${type==="num"?"number":type}" ${type==="num"?'step="any" inputmode="decimal"':""} value="${esc(val??"")}" ${d}></label>`;
}
function readFields(root){
  const o={}; root.querySelectorAll("[data-k]").forEach(el=>{ let v=el.value; if(el.dataset.bool) v=v==="true"; else if(el.type==="number") v=v===""?null:Number(v); else v=v===""?null:v; o[el.dataset.k]=v; }); return o;
}

  try{
    const [lot] = await q(sb.from("lo_hang_xem").select("*").eq("so_bl",bl));
    if(!lot) return $("#main").innerHTML=`<div class="empty">Không tìm thấy lô ${esc(bl)}. <a href="#lo-hang">Về danh sách</a></div>`;
    const [cts, dcs, nks] = await Promise.all([
      q(sb.from("chung_tu").select("*").eq("so_bl",bl)),
      q(sb.from("doi_chieu_xem").select("*").eq("so_bl",bl)),
      q(sb.from("nhat_ky_lo").select("*").eq("so_bl",bl).order("ngay",{ascending:false}).order("id",{ascending:false}))
    ]);
    renderLot(lot, cts, dcs, nks);
  }catch(e){ fail(e); }
}

function lotVerdict(lot, cts, dcs){
  const bad = dcs.filter(d=>d.ket_qua==="Lệch"||d.ket_qua==="Không có thông tin").length;
  const wait = dcs.filter(d=>d.ket_qua==="Chờ tick").length;
  const req = S.cat.chung_tu_theo_ho_so.filter(r=>r.ho_so_nuoc_id===lot.ho_so_nuoc_id && r.bat_buoc);
  const notOk = req.filter(r=>!cts.some(c=>c.loai_chung_tu_id===r.loai_chung_tu_id && c.trang_thai==="Đạt")).length;
  if(bad) return ["t-bad",`Chưa đạt: ${bad} ô lệch chưa được tick`];
  if(wait) return ["t-warn",`Chờ tick: còn ${wait} ô chưa kiểm tay`];
  if(notOk) return ["t-warn",`Còn ${notOk} chứng từ bắt buộc chưa Đạt`];
  return ["t-ok","Đủ điều kiện xác nhận Đạt"];
}

function diffHtml(v, base){
  v=v??""; base=base??"";
  if(v===base) return esc(v);
  let out="", firstDiff=-1;
  const n=Math.max(v.length, base.length);
  for(let i=0;i<n;i++){
    const a=v[i], b=base[i];
    if(a===b){ out+=esc(a); continue; }
    if(firstDiff<0) firstDiff=i;
    if(a===undefined) out+=`<span class="miss" title="Thiếu so với gốc: ${esc(b)}">▿</span>`;
    else out+=`<mark title="${b===undefined?"thừa":"gốc là “"+esc(b===" "?"·":b)+"”"}">${a===" "?"·":a==="\n"?"↵":esc(a)}</mark>`;
  }
  return out+(firstDiff>=0?`<div class="small muted">Lệch từ ký tự thứ ${firstDiff+1}</div>`:"");
}

function enLabel(ma){ return S.cat.ten_goi.find(g=>g.ma_truong===ma && !g.ho_so_nuoc_id)?.ten_goi || truongName(ma); }
function showRequest(lot, cts, dcs, gocCt){
  const lines=[];
  for(const c of cts){
    const errs = dcs.filter(d=>d.chung_tu_id===c.id && (d.ket_qua==="Lệch"||d.ket_qua==="Không có thông tin"));
    const base = ma => gocCt ? dcs.find(d=>d.chung_tu_id===gocCt.id && d.ma_truong===ma)?.gia_tri : null;
    if(!errs.length && c.trang_thai!=="Sai – chờ nhà cung cấp sửa") continue;
    lines.push(`- ${loaiName(c.loai_chung_tu_id)}${c.so_chung_tu?" No. "+c.so_chung_tu:""}:`);
    errs.forEach(d=>lines.push(`   • ${enLabel(d.ma_truong)}: shows "${d.gia_tri}"${base(d.ma_truong)!=null?`, should be "${base(d.ma_truong)}" as per ${loaiName(lot.chung_tu_goc_id)}`:""}.`));
    if(c.ghi_chu) lines.push(`   • Note: ${c.ghi_chu}`);
  }
  const txt = lines.length ? `Dear Supplier,\n\nRe: B/L ${lot.so_bl} – ${lot.san_pham}${lot.so_invoice?` – Invoice ${lot.so_invoice}`:""}\n\nPlease amend the following documents and send us the corrected drafts for approval:\n\n${lines.join("\n")}\n\nThank you.\nBest regards,\n${S.me.ho_ten||""}` : "";
  modal(`<h2>Yêu cầu chỉnh sửa gửi nhà cung cấp</h2>${txt?`<textarea id="rq" style="min-height:300px">${esc(txt)}</textarea>
    <div class="row" style="margin-top:10px"><button id="cp" class="btn">Sao chép</button><button class="btn ghost" data-close>Đóng</button></div>`
    :`<p>Lô không có ô lệch nào chưa tick và không có chứng từ ở trạng thái Sai.</p><button class="btn ghost" data-close>Đóng</button>`}`);
  $("#cp")?.addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText($("#rq").value); toast("Đã sao chép"); }catch{ $("#rq").select(); document.execCommand("copy"); toast("Đã sao chép"); } });
}
function modal(html){ const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(m);
  m.addEventListener("click",e=>{ if(e.target===m||e.target.closest("[data-close]")) m.remove(); }); return m; }

function docFields(lot, ct){

    return {ma:t.ma_truong, label:t.ten_truong, onDoc:r?.ten_goi_rieng||aliases[0], aliases:[...new Set(aliases)], hidden:r?.hien===false, req:!!r?.bat_buoc, type:t.kieu_du_lieu};

function setVal(ma, v, src){ const t=document.querySelector(`[data-val="${ma}"]`); if(!t) return; t.value=v; t.dataset.src=src; t.dataset.dirty="1"; const l=document.querySelector(`[data-srcl="${ma}"]`); if(l) l.textContent=src+" (chưa lưu)"; }
async function saveDirty(){
  const rows=[...document.querySelectorAll("[data-val][data-dirty]")].map(t=>({chung_tu_id:D.ct.id, ma_truong:t.dataset.val, gia_tri:t.value===""?null:t.value, nguon_gia_tri:t.dataset.src||"Nhập tay"}))
    .filter(r=>{ const old=D.dcs.find(d=>d.ma_truong===r.ma_truong); return !old || old.gia_tri!==r.gia_tri || old.nguon_gia_tri!==r.nguon_gia_tri; });
  if(!rows.length) return toast("Không có ô nào thay đổi.");
  try{ await q(sb.from("doi_chieu").upsert(rows,{onConflict:"chung_tu_id,ma_truong"})); toast(`Đã lưu ${rows.length} ô`); viewDoc(D.ct.id); }catch(e){ fail(e); }
}

/* Đọc file: lấy văn bản, chuẩn bị nguồn để khoanh vùng */
async function handleFile(file, store){
  const info=$("#srcInfo"); info.textContent="Đang đọc "+file.name+"…";
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  try{
    D.src=null; D.text=""; D.textKind="";
    if(ext==="pdf"){
      await loadScript(LIB.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      D.src={kind:"pdf", pdf, pages:pdf.numPages, name:file.name};
      const out=[]; for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent(); out.push(linesFromItems(tc.items)); }
      D.text=out.join("\n\n").trim(); D.textKind=D.text?"pdf":"none";
    }else if(ext==="docx"){
      await loadScript(LIB.mammoth); const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}); D.text=r.value; D.textKind="text";
    }else if(["xlsx","xls","csv"].includes(ext)){
      await loadScript(LIB.xlsx); const wb=XLSX.read(await file.arrayBuffer()); D.text=wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:"  "})).join("\n\n"); D.textKind="text";
    }else if(["png","jpg","jpeg","webp"].includes(ext)){
      const img=new Image(); img.src=URL.createObjectURL(file); await img.decode(); D.src={kind:"img", img, pages:1, name:file.name}; D.textKind="none";
    }else throw new Error("Định dạng ."+ext+" chưa hỗ trợ. Dùng Word (.docx), PDF, Excel hoặc ảnh.");
    if(store && canEditLot(D.lot) && D.ct.trang_thai==="Nháp"){
      const path=`${D.lot.so_bl}/${D.ct.id}/${Date.now()}_${file.name.replace(/[^\w.\-]+/g,"_")}`;
      const {error}=await sb.storage.from("chung-tu").upload(path, file, {contentType:file.type||undefined});
      if(error) toast("Không lưu được file: "+viErr(error.message), true);
      else { await q(sb.from("chung_tu").update({file_dinh_kem:path}).eq("id",D.ct.id)); D.ct.file_dinh_kem=path; }
    }
    renderDoc();
    toast(D.textKind==="none" ? "File là ảnh hoặc PDF scan, không có lớp chữ. Bấm “Khoanh vùng trên file” để nhận dạng chữ." : "Đã đọc văn bản. Bôi đen để điền, hoặc bấm “Tự nhận diện theo tên gọi”.");
  }catch(e){ info.textContent=""; fail(e); }
}
function linesFromItems(items){
  const rows=[]; for(const it of items){ if(!it.str) continue; const y=Math.round(it.transform[5]); let r=rows.find(r=>Math.abs(r.y-y)<=3); if(!r){ r={y,parts:[]}; rows.push(r); } r.parts.push([it.transform[4], it.str]); }
  rows.sort((a,b)=>b.y-a.y); return rows.map(r=>r.parts.sort((a,b)=>a[0]-b[0]).map(p=>p[1]).join(" ").replace(/\s{2,}/g," ").trim()).join("\n");
}
function autoDetect(){
  const text=$("#raw").value; if(!text.trim()) return toast("Chưa có văn bản. Chọn file Word, PDF hoặc Excel trước.", true);
  const lines=text.split(/\r?\n/); let n=0;
  const src = D.textKind==="pdf" ? "Lớp chữ PDF" : "Bôi đen văn bản";
  for(const f of D.fields.filter(f=>!f.hidden)){
    const t=document.querySelector(`[data-val="${f.ma}"]`); if(!t || t.value.trim()) continue;
    let found=null;
    for(const a of f.aliases.slice().sort((x,y)=>y.length-x.length)){
      const al=a.toLowerCase();
      for(let i=0;i<lines.length && !found;i++){
        const idx=lines[i].toLowerCase().indexOf(al); if(idx<0) continue;
        let rest=lines[i].slice(idx+a.length).replace(/^[\s:.#\-–]+/,"").trim();
        if(!rest){ for(let j=i+1;j<lines.length;j++){ if(lines[j].trim()){ rest=lines[j].trim(); break; } } }
        if(rest) found=rest;
      }
      if(found) break;
    }
    if(found){ setVal(f.ma, found, src); n++; }
  }
  toast(n ? `Đã điền ${n} trường. Kiểm tra lại rồi bấm “Lưu các ô đã sửa”.` : "Không tìm thấy trường nào theo tên gọi. Thử bôi đen hoặc khoanh vùng.", !n);
}

/* Khoanh vùng trên file + OCR */
async function renderPage(p, scale){
  const c=document.createElement("canvas");
  if(D.src.kind==="pdf"){ const page=await D.src.pdf.getPage(p); const vp=page.getViewport({scale}); c.width=vp.width; c.height=vp.height; await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise; return {c, page, vp}; }
  const img=D.src.img; c.width=img.naturalWidth*scale; c.height=img.naturalHeight*scale; c.getContext("2d").drawImage(img,0,0,c.width,c.height); return {c};
}
async function extractRegion(r, rel){ // rel = {x,y,w,h} tỉ lệ 0..1
  const W=r.c.width, H=r.c.height, x=rel.x*W, y=rel.y*H, w=rel.w*W, h=rel.h*H;
  if(r.page){
    const tc=await r.page.getTextContent(); const items=[];
    for(const it of tc.items){ if(!it.str.trim()) continue; const t=pdfjsLib.Util.transform(r.vp.transform, it.transform); const ix=t[4], iy=t[5], ih=Math.hypot(t[2],t[3]);
      if(ix>=x-2 && ix<=x+w && iy>=y && iy-ih<=y+h) items.push({str:it.str, transform:[0,0,0,0,ix,-iy]}); }
    const txt=linesFromItems(items).trim(); if(txt) return {txt, ocr:false};
  }
  await loadScript(LIB.ocr);
  const cc=document.createElement("canvas"); cc.width=Math.max(1,w*2); cc.height=Math.max(1,h*2); cc.getContext("2d").drawImage(r.c,x,y,w,h,0,0,cc.width,cc.height);
  const lang=localStorage.getItem("ocrLang")||"eng";
  const res=await Tesseract.recognize(cc, lang);
  return {txt:res.data.text.trim(), ocr:true};
}
async function openRegion(ma){
  if(!D.src) return toast("Chọn file PDF hoặc ảnh trước khi khoanh vùng. Với Word hoặc Excel, hãy bôi đen trong khung văn bản.", true);
  let page=1, zoom=1, rel=null, rnd=null;
  const shown=D.fields.filter(f=>!f.hidden);
  const m=modal(`<div class="row" style="justify-content:space-between"><h2>Khoanh vùng</h2><button class="btn sm ghost" data-close>Đóng</button></div>
    <div class="row small"><select id="rgF" style="width:auto">${shown.map(f=>`<option value="${f.ma}" ${f.ma===ma?"selected":""}>${esc(f.label)}</option>`).join("")}</select>
      <button id="pv" class="btn sm ghost">‹ Trang trước</button><span id="pg"></span><button id="pn" class="btn sm ghost">Trang sau ›</button>
      <button id="zo" class="btn sm ghost">Thu nhỏ</button><button id="zi" class="btn sm ghost">Phóng to</button>
      <label>Ngôn ngữ OCR <select id="lang" style="width:auto">${[["eng","Anh"],["vie","Việt"],["fra","Pháp"],["spa","Tây Ban Nha"]].map(([v,l])=>`<option value="${v}" ${(localStorage.getItem("ocrLang")||"eng")===v?"selected":""}>${l}</option>`).join("")}</select></label></div>
    <p class="small muted">Kéo ngón tay hoặc chuột quanh phần thông tin của trường đang chọn.</p>
    <div class="canvas-wrap" id="cw"></div>
    <label class="f" style="margin-top:8px"><span id="rgNote">Văn bản trong vùng chọn, sửa lại nếu chưa đúng</span><textarea id="rgT" style="min-height:70px"></textarea></label>
    <label class="row small"><input type="checkbox" id="rem" checked> Nhớ vùng này để tự dò ở các lô sau</label>
    <div class="row" style="margin-top:8px"><button id="rgFill" class="btn">Điền vào trường</button></div>`);
  let ocr=false;
  const draw=async()=>{ m.querySelector("#pg").textContent=`Trang ${page}/${D.src.pages}`; const wrap=m.querySelector("#cw"); wrap.innerHTML='<div class="empty">Đang hiển thị trang…</div>';
    const base=Math.min(2.2, (wrap.clientWidth||600)/ (D.src.kind==="pdf"?612:D.src.img.naturalWidth));
    rnd=await renderPage(page, base*zoom); wrap.innerHTML=""; wrap.appendChild(rnd.c); const box=document.createElement("div"); box.className="selbox"; box.style.display="none"; wrap.appendChild(box);
    let st=null;
    const pos=e=>{ const b=rnd.c.getBoundingClientRect(); return [Math.min(Math.max(e.clientX-b.left,0),b.width), Math.min(Math.max(e.clientY-b.top,0),b.height), b.width, b.height]; };
    rnd.c.onpointerdown=e=>{ e.preventDefault(); rnd.c.setPointerCapture(e.pointerId); st=pos(e); box.style.display="block"; Object.assign(box.style,{left:st[0]+"px",top:st[1]+"px",width:0,height:0}); };
    rnd.c.onpointermove=e=>{ if(!st) return; const p=pos(e); Object.assign(box.style,{left:Math.min(st[0],p[0])+"px",top:Math.min(st[1],p[1])+"px",width:Math.abs(p[0]-st[0])+"px",height:Math.abs(p[1]-st[1])+"px"}); };
    rnd.c.onpointerup=async e=>{ if(!st) return; const p=pos(e); const [W,H]=[p[2],p[3]]; rel={x:Math.min(st[0],p[0])/W, y:Math.min(st[1],p[1])/H, w:Math.abs(p[0]-st[0])/W, h:Math.abs(p[1]-st[1])/H}; st=null;
      if(rel.w<0.01||rel.h<0.005) return; m.querySelector("#rgNote").textContent="Đang lấy chữ…";
      try{ const r=await extractRegion(rnd, rel); ocr=r.ocr; m.querySelector("#rgT").value=r.txt;
        m.querySelector("#rgNote").textContent = r.txt ? (r.ocr?"Nhận dạng chữ từ ảnh (OCR): hãy so từng ký tự, dấu và khoảng trắng với bản gốc.":"Lấy từ lớp chữ của PDF.") : "Không có chữ nào trong vùng này. Thử khoanh rộng hơn."; }catch(er){ fail(er); } };
  };
  m.querySelector("#pv").onclick=()=>{ if(page>1){page--;draw();} };
  m.querySelector("#pn").onclick=()=>{ if(page<D.src.pages){page++;draw();} };
  m.querySelector("#zi").onclick=()=>{ zoom=Math.min(3,zoom*1.3); draw(); };
  m.querySelector("#zo").onclick=()=>{ zoom=Math.max(.5,zoom/1.3); draw(); };
  m.querySelector("#lang").onchange=e=>localStorage.setItem("ocrLang",e.target.value);
  m.querySelector("#rgFill").onclick=async()=>{
    const f=m.querySelector("#rgF").value, txt=m.querySelector("#rgT").value.trim(); if(!txt) return toast("Chưa có chữ để điền.", true);
    setVal(f, txt, ocr?"OCR":"Lớp chữ PDF");
    if(m.querySelector("#rem").checked && rel){
      const {error}=await sb.from("vung_nho").insert({ho_so_nuoc_id:D.lot.ho_so_nuoc_id, loai_chung_tu_id:D.ct.loai_chung_tu_id, ma_truong:f, trang:page, vi_tri_vung:rel});
      if(error) toast(/duplicate/.test(error.message)?"Đã điền. Trường này đã có vùng nhớ; chỉ quản trị viên được thay vùng.":viErr(error.message), true);
      else { toast("Đã điền và nhớ vùng của “"+truongName(f)+"”"); D.vn.push({ma_truong:f}); }
    } else toast("Đã điền “"+truongName(f)+"”. Chọn trường tiếp theo và khoanh tiếp.");
  };
  draw();
}
async function readMemory(){
  if(!D.src) return toast("Chọn file PDF hoặc ảnh của chứng từ trước, rồi bấm dò theo vùng đã nhớ.", true);
  let n=0, ocr=0, i=0; const cache={};
  for(const v of D.vn){
    if(!D.fields.some(f=>f.ma===v.ma_truong && !f.hidden)) continue;
    i++; toast(`Đang dò theo vùng đã nhớ: ${i}/${D.vn.length} trường…`);
    if(v.trang>D.src.pages) continue;
    cache[v.trang] ||= await renderPage(v.trang, 2);
    try{ const r=await extractRegion(cache[v.trang], v.vi_tri_vung); if(r.txt){ setVal(v.ma_truong, r.txt, r.ocr?"OCR":"Vùng đã nhớ"); n++; if(r.ocr) ocr++; } }catch(e){ console.warn(e); }
  }
  toast(n ? `Đã lấy ${n} trường theo vùng đã nhớ${ocr?`, ${ocr} trường nhận dạng từ ảnh cần so từng ký tự`:""}. Kiểm tra rồi bấm Lưu.` : "Không lấy được chữ nào từ các vùng đã nhớ. File này có thể có bố cục khác, hãy khoanh lại.", !n);
}

const ADM = {
  "Tài khoản":{t:"nguoi_dung", key:"id", noAdd:true, cols:[["email","Email","ro"],["ho_ten","Họ tên","text"],["vai_tro","Vai trò","sel",()=>[["nhan_vien","Nhân viên chứng từ"],["quan_ly","Trưởng phòng"],["quan_tri","Quản trị viên"]]],["dang_hoat_dong","Đang hoạt động","bool"]],
    note:"Bấm “Tạo tài khoản” để cấp tài khoản mới, đăng nhập được ngay. Khi nhân viên quên mật khẩu, bấm “Đặt lại mật khẩu” ở dòng của người đó rồi báo mật khẩu mới cho họ. Muốn khóa tài khoản, sửa “Đang hoạt động” thành Không."},
  "Công ty":{t:"cong_ty", key:"ma_cong_ty", noAdd:true, cols:[["ma_cong_ty","Mã","ro"],["ten_chinh_thuc","Tên chính thức","text"],["ma_so_thue","Mã số thuế","text"],["dia_chi","Địa chỉ","text"]]},
  "Hồ sơ nước":{t:"ho_so_nuoc", key:"id", cols:[["ten_ho_so","Tên hồ sơ","text",null,1],["ten_tieng_anh","Tên tiếng Anh","text"],["dang_dung","Đang dùng","bool"]]},
  "Loại chứng từ":{t:"loai_chung_tu", key:"id", cols:[["ten_loai","Tên loại","text",null,1],["dang_dung","Đang dùng","bool"]]},
  "Chứng từ theo hồ sơ":{t:"chung_tu_theo_ho_so", key:"id", cols:[["ho_so_nuoc_id","Hồ sơ nước","sel",()=>S.cat.ho_so_nuoc.map(h=>[h.id,h.ten_ho_so]),1],["loai_chung_tu_id","Loại chứng từ","sel",()=>S.cat.loai_chung_tu.map(l=>[l.id,l.ten_loai]),1],["ten_hien_thi","Tên hiển thị","text",null,1],["bat_buoc","Bắt buộc","bool"]]},
  "Trường thông tin":{t:"truong_thong_tin", key:"ma_truong", cols:[["ma_truong","Mã trường (không dấu)","text",null,1],["ten_truong","Tên trường","text",null,1],["kieu_du_lieu","Kiểu dữ liệu","sel",()=>[["Chữ","Chữ"],["Số","Số"],["Ngày","Ngày"]]],["dung_doi_chieu","Đưa vào đối chiếu","bool"],["dang_dung","Đang dùng","bool"]]},
  "Tên gọi tương đương":{t:"ten_goi", key:"id", cols:[["ma_truong","Trường","sel",()=>S.cat.truong_thong_tin.map(t=>[t.ma_truong,t.ten_truong]),1],["ho_so_nuoc_id","Hồ sơ nước (trống = mọi nước)","sel",()=>[["","Mọi nước"],...S.cat.ho_so_nuoc.map(h=>[h.id,h.ten_ho_so])]],["ten_goi","Tên gọi in trên chứng từ","text",null,1]]},
  "Trường theo chứng từ":{t:"truong_theo_chung_tu", key:"id", cols:[["ho_so_nuoc_id","Hồ sơ nước","sel",()=>S.cat.ho_so_nuoc.map(h=>[h.id,h.ten_ho_so]),1],["loai_chung_tu_id","Loại chứng từ","sel",()=>S.cat.loai_chung_tu.map(l=>[l.id,l.ten_loai]),1],["ma_truong","Trường","sel",()=>S.cat.truong_thong_tin.map(t=>[t.ma_truong,t.ten_truong]),1],["hien","Hiện ở chứng từ này","bool"],["ten_goi_rieng","Tên gọi riêng","text"],["bat_buoc","Bắt buộc","bool"]],
    note:"Mặc định mọi trường hiện ở mọi chứng từ. Chỉ thêm dòng ở đây khi cần ẩn trường, đặt tên gọi riêng hoặc bắt buộc."},
  "Cấu hình":{t:"cau_hinh", key:"ten_muc", cols:[["ten_muc","Mục","ro"],["gia_tri","Giá trị","text"]], noAdd:true},
  "Vùng đã nhớ":{t:"vung_nho", key:"id", noAdd:true, del:true, cols:[["ho_so_nuoc_id","Hồ sơ nước","ro",id=>hsName(id)],["loai_chung_tu_id","Loại chứng từ","ro",id=>loaiName(id)],["ma_truong","Trường","ro",m=>truongName(m)],["trang","Trang","ro"]]}
};
let admTab="Tài khoản";
async function viewAdmin(){
  shell("#quan-tri", `<h1>Quản trị</h1><div class="chips">${[...Object.keys(ADM),"Sao lưu cấu hình"].map(k=>`<button class="chip ${admTab===k?"on":""}" data-t="${esc(k)}">${k}</button>`).join("")}</div><div id="adm" style="margin-top:12px"><div class="empty">Đang tải…</div></div>`);
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ admTab=b.dataset.t; viewAdmin(); });
  if(admTab==="Sao lưu cấu hình") return admBackup();
  const def=ADM[admTab];
  try{
    const rows = await all(()=>sb.from(def.t).select("*").order(def.key));
    const show=(c,r)=>{ const v=r[c[0]]; if(c[2]==="bool") return v?"Có":"Không"; if(c[2]==="sel"){ const o=c[3]().find(x=>String(x[0])===String(v??"")); return o?o[1]:(v??""); } if(c[2]==="ro"&&typeof c[3]==="function") return c[3](v); return v??""; };
    $("#adm").innerHTML = `${def.note?`<p class="small muted">${def.note}</p>`:""}
      <div class="row"><input id="as" class="grow" placeholder="Lọc nhanh">${def.noAdd?"":`<button id="aAdd" class="btn">Thêm</button>`}${admTab==="Tài khoản"?`<button id="aNew" class="btn">Tạo tài khoản</button>`:""}</div>
      <div class="scroll panel" style="padding:0"><table><thead><tr>${def.cols.map(c=>`<th>${c[1]}</th>`).join("")}<th></th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr data-i="${i}">${def.cols.map(c=>`<td>${esc(show(c,r))}</td>`).join("")}<td>${def.del?`<button class="btn sm bad" data-del="${i}">Xóa</button>`:`<button class="btn sm ghost" data-ed="${i}">Sửa</button>`}${admTab==="Tài khoản"?` <button class="btn sm ghost" data-rs="${i}">Đặt lại mật khẩu</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;
    $("#as").oninput=e=>{ const s=e.target.value.toLowerCase(); document.querySelectorAll("#adm tbody tr").forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(s)?"":"none"); };
    const form=(r)=>{ const isNew=!r; const m=modal(`<h2>${isNew?"Thêm":"Sửa"} · ${admTab}</h2><form id="af"><div class="grid">${def.cols.map(c=>{
        const v=r?.[c[0]]; if(c[2]==="ro") return isNew?"":`<label class="f"><span>${c[1]}</span><input value="${esc(show(c,r))}" disabled></label>`;
        if(c[2]==="bool") return `<label class="f"><span>${c[1]}</span><select name="${c[0]}" data-type="bool"><option value="true" ${v!==false?"selected":""}>Có</option><option value="false" ${v===false?"selected":""}>Không</option></select></label>`;
        if(c[2]==="sel") return `<label class="f"><span>${c[1]}</span><select name="${c[0]}" ${c[4]&&!isNew?"disabled":""}>${c[3]().map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v??"")?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
        return `<label class="f"><span>${c[1]}${c[4]?" *":""}</span><input name="${c[0]}" value="${esc(v??"")}" ${c[4]?"required":""} ${c[0]==="ma_truong"&&!isNew?"disabled":""}></label>`; }).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="btn">${isNew?"Thêm":"Lưu"}</button><button type="button" class="btn ghost" data-close>Hủy</button></div></form>`);
      m.querySelector("#af").onsubmit=async e=>{ e.preventDefault(); const o={};
        m.querySelectorAll("[name]").forEach(el=>{ if(el.disabled) return; let v=el.value; if(el.dataset.type==="bool") v=v==="true"; else if(/_id$/.test(el.name)) v=v===""?null:Number(v); else v=v===""?null:v; o[el.name]=v; });
        try{ if(isNew) await q(sb.from(def.t).insert(o)); else { const d=await q(sb.from(def.t).update(o).eq(def.key, r[def.key]).select()); if(!d.length) throw new Error("Không lưu được."); }
          m.remove(); toast(isNew?"Đã thêm":"Đã lưu"); await loadCatalogs(); viewAdmin(); }catch(er){ fail(er);} };
    };
    $("#aAdd")?.addEventListener("click",()=>form(null));
    $("#aNew")?.addEventListener("click",()=>{ const pw=randomPassword(); const m=modal(`<h2>Tạo tài khoản</h2><form id="nu"><div class="grid">
        <label class="f"><span>Email đăng nhập *</span><input name="email" type="email" required inputmode="email"></label>
        <label class="f"><span>Họ tên</span><input name="ho_ten"></label>
        <label class="f"><span>Vai trò</span><select name="vai_tro"><option value="nhan_vien">Nhân viên chứng từ</option><option value="quan_ly">Trưởng phòng</option><option value="quan_tri">Quản trị viên</option></select></label>
        <label class="f"><span>Mật khẩu ban đầu (ít nhất 6 ký tự)</span><input name="mat_khau" value="${pw}" minlength="6" required></label></div>
        <p class="small muted">Tài khoản được xác nhận email sẵn và dùng được ngay. Ghi lại mật khẩu để báo cho người dùng; họ có thể tự đổi sau khi đăng nhập.</p>
        <div class="row"><button class="btn">Tạo tài khoản</button><button type="button" class="btn ghost" data-close>Hủy</button></div></form>`);
      m.querySelector("#nu").onsubmit=async e=>{ e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); const b=e.target.querySelector("button"); b.disabled=true;
        try{ await callAccount({action:"tao", ...f}); m.remove(); toast("Đã tạo tài khoản "+f.email); await loadCatalogs(); viewAdmin(); }catch(er){ b.disabled=false; fail(er);} }; });
    document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{ const u=rows[+b.dataset.rs]; const pw=randomPassword(); const m=modal(`<h2>Đặt lại mật khẩu</h2>
        <p>Tài khoản <b>${esc(u.email)}</b></p><form id="rs"><label class="f"><span>Mật khẩu mới (ít nhất 6 ký tự)</span><input name="mat_khau" value="${pw}" minlength="6" required></label>
        <p class="small muted">Mật khẩu cũ hết hiệu lực ngay. Báo mật khẩu mới cho người dùng qua kênh riêng.</p>
        <div class="row"><button class="btn">Đặt lại mật khẩu</button><button type="button" class="btn ghost" data-close>Hủy</button></div></form>`);
      m.querySelector("#rs").onsubmit=async e=>{ e.preventDefault(); const mk=e.target.mat_khau.value; const bt=e.target.querySelector("button"); bt.disabled=true;
        try{ await callAccount({action:"dat_lai_mat_khau", user_id:u.id, mat_khau:mk}); m.remove(); toast("Đã đặt lại mật khẩu cho "+u.email); }catch(er){ bt.disabled=false; fail(er);} }; });
    document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>form(rows[+b.dataset.ed]));
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("Xóa vùng nhớ này?")) return; try{ await q(sb.from(def.t).delete().eq("id",rows[+b.dataset.del].id)); toast("Đã xóa vùng nhớ"); viewAdmin(); }catch(e){ fail(e);} });
  }catch(e){ fail(e); }
}
function admBackup(){
  $("#adm").innerHTML = `<div class="panel"><h3>Xuất cấu hình</h3><p class="small muted">Tải về file JSON gồm hồ sơ nước, loại chứng từ, trường, tên gọi, cấu hình theo chứng từ và mốc nhắc việc.</p><button id="ex" class="btn">Xuất cấu hình</button></div>
    <div class="panel"><h3>Nhập cấu hình</h3><p class="small muted">Thêm hoặc cập nhật theo tên. Dữ liệu hiện có không bị xóa.</p><input id="im" type="file" accept=".json,application/json"></div>`;
  $("#ex").onclick=async()=>{ try{ await loadCatalogs(); const c=S.cat;
    const out={phien_ban:1, xuat_luc:new Date().toISOString(),
      ho_so_nuoc:c.ho_so_nuoc.map(({ten_ho_so,ten_tieng_anh,dang_dung})=>({ten_ho_so,ten_tieng_anh,dang_dung})),
      loai_chung_tu:c.loai_chung_tu.map(({ten_loai,dang_dung})=>({ten_loai,dang_dung})),
      truong_thong_tin:c.truong_thong_tin, cau_hinh:c.cau_hinh,
      chung_tu_theo_ho_so:c.chung_tu_theo_ho_so.map(r=>({ho_so:hsName(r.ho_so_nuoc_id), loai:loaiName(r.loai_chung_tu_id), ten_hien_thi:r.ten_hien_thi, bat_buoc:r.bat_buoc})),
      ten_goi:c.ten_goi.map(r=>({ma_truong:r.ma_truong, ho_so:r.ho_so_nuoc_id?hsName(r.ho_so_nuoc_id):null, ten_goi:r.ten_goi})),
      truong_theo_chung_tu:c.truong_theo_chung_tu.map(r=>({ho_so:hsName(r.ho_so_nuoc_id), loai:loaiName(r.loai_chung_tu_id), ma_truong:r.ma_truong, hien:r.hien, ten_goi_rieng:r.ten_goi_rieng, bat_buoc:r.bat_buoc}))};
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"})); a.download=`cau-hinh-kiem-tra-chung-tu-${today()}.json`; a.click(); toast("Đã tải file cấu hình"); }catch(e){ fail(e);} };
  $("#im").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; if(!confirm("Nhập cấu hình từ "+f.name+"?")) return;
    try{ const j=JSON.parse(await f.text());
      if(j.ho_so_nuoc) await q(sb.from("ho_so_nuoc").upsert(j.ho_so_nuoc,{onConflict:"ten_ho_so"}));
      if(j.loai_chung_tu) await q(sb.from("loai_chung_tu").upsert(j.loai_chung_tu,{onConflict:"ten_loai"}));
      if(j.truong_thong_tin) await q(sb.from("truong_thong_tin").upsert(j.truong_thong_tin,{onConflict:"ma_truong"}));
      if(j.cau_hinh) await q(sb.from("cau_hinh").upsert(j.cau_hinh,{onConflict:"ten_muc"}));
      await loadCatalogs();
      const hid=n=>S.cat.ho_so_nuoc.find(h=>h.ten_ho_so===n)?.id, lid=n=>S.cat.loai_chung_tu.find(l=>l.ten_loai===n)?.id;
      if(j.chung_tu_theo_ho_so) await q(sb.from("chung_tu_theo_ho_so").upsert(j.chung_tu_theo_ho_so.map(r=>({ho_so_nuoc_id:hid(r.ho_so), loai_chung_tu_id:lid(r.loai), ten_hien_thi:r.ten_hien_thi, bat_buoc:r.bat_buoc})).filter(r=>r.ho_so_nuoc_id&&r.loai_chung_tu_id),{onConflict:"ho_so_nuoc_id,loai_chung_tu_id"}));
      if(j.ten_goi) await q(sb.from("ten_goi").upsert(j.ten_goi.map(r=>({ma_truong:r.ma_truong, ho_so_nuoc_id:r.ho_so?hid(r.ho_so):null, ten_goi:r.ten_goi})),{onConflict:"ma_truong,ho_so_nuoc_id,ten_goi",ignoreDuplicates:true}));
      if(j.truong_theo_chung_tu) await q(sb.from("truong_theo_chung_tu").upsert(j.truong_theo_chung_tu.map(r=>({ho_so_nuoc_id:hid(r.ho_so), loai_chung_tu_id:lid(r.loai), ma_truong:r.ma_truong, hien:r.hien, ten_goi_rieng:r.ten_goi_rieng, bat_buoc:r.bat_buoc})).filter(r=>r.ho_so_nuoc_id&&r.loai_chung_tu_id),{onConflict:"ho_so_nuoc_id,loai_chung_tu_id,ma_truong"}));
      await loadCatalogs(); toast("Đã nhập cấu hình");
    }catch(er){ fail(er); } };
}
</script>
